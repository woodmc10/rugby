services:
  rugby-dev:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: rugby-tackles-dev-local
    volumes:
      - .:/app
      - ./data:/app/data
      - ./experiments:/app/experiments
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/app
    stdin_open: true
    tty: true
    command: bash

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: rugby-tackles-jupyter-local
    volumes:
      - .:/app
      - ./data:/app/data
      - ./experiments:/app/experiments
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/app
    command: >
      bash -c "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root 
               --NotebookApp.token='' --NotebookApp.password=''"